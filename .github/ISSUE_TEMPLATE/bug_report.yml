name: 🐛 Bug Report
description: Report a problem with Ore XP Orbs
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with Ore XP Orbs!
        Please provide as much information as possible below.

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Version
      description: Which Minecraft version are you using?
      placeholder: "Example: 26.2"
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Ore XP Orbs Version
      description: Which version of Ore XP Orbs are you using?
      placeholder: "Example: 1.1"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Version Type
      description: Which version of Ore XP Orbs are you using?
      options:
        - Datapack
        - Fabric
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem you encountered.
      placeholder: "Tell what went wrong..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Tell how one can reproduce the issue.
      placeholder: |
        1. Mine...
        2. Use...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add screenshots, logs, other installed mods, or anything else that may help.
    validations:
      required: false
