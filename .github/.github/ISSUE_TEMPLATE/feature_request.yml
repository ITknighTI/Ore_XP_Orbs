name: 💡 Feature Request
description: Suggest a new feature or change for Ore XP Orbs
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to Ore XP Orbs!

  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you'd like added.
      placeholder: "I'd like Ore XP Orbs to..."
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why should this be added?
      description: Explain how this would improve the datapack/mod.
      placeholder: "This would be useful because..."
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Suggested Implementation
      description: If you have an idea for how the feature should work, describe it here.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add screenshots, examples, references, or any other relevant information.
    validations:
      required: false
